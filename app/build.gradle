apply plugin: 'com.android.application'

// Version components from release-please
// versionCode = MAJOR * 10000 + MINOR * 100 + PATCH (e.g., 20.0.0 -> 200000)
def versionMajor = 20 // x-release-please-major
def versionMinor = 2 // x-release-please-minor
def versionPatch = 0 // x-release-please-patch

android {
    namespace 'org.surfsite.gexporter'
    compileSdk = 37

    defaultConfig {
        applicationId "org.surfsite.gexporter"
        minSdkVersion 23
        targetSdk = 37
        versionCode versionMajor * 10000 + versionMinor * 100 + versionPatch
        versionName "${versionMajor}.${versionMinor}.${versionPatch}"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        resValues true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility 11
        targetCompatibility 11
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:deprecation"
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation('androidx.test.espresso:espresso-core:3.6.1', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.transition:transition:1.7.0'

    implementation 'com.google.android.material:material:1.14.0'

    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'org.gavaghan:geodesy:1.1.3'
    implementation 'org.slf4j:slf4j-api:2.0.18'
    implementation 'com.github.tony19:logback-android:3.0.0'

    implementation 'com.google.code.gson:gson:2.14.0'

    implementation 'org.apache.commons:commons-lang3:3.20.0'

    implementation 'com.garmin:fit:21.205.0'
    implementation 'com.garmin.connectiq:ciq-companion-app-sdk:2.4.0@aar'

//    androidTestImplementation group: 'ch.qos.logback', name: 'logback-classic', version: '1.2.3'
//    androidTestImplementation group: 'xpp3', name: 'xpp3_min', version: '1.1.3.4.O'
//    androidTestImplementation group: 'xmlpull', name: 'xmlpull', version: '1.1.3.1'
//    androidTestImplementation 'xpp3:xpp3_min:1.1.3.4.O'
//    androidTestImplementation 'xmlpull:xmlpull:1.1.3.1'
//    androidTestImplementation 'org.mockito:mockito-core:1.10.19'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
    testImplementation 'org.slf4j:slf4j-api:2.0.18'

    //testImplementation 'xmlpull:xmlpull:1.1.3.1'
}
